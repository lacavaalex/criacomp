# ─────────────────────────────────────────────────────────────────────
#  Posto de supervisão de agentes
#  CriaComp 2026.2 · human harness
#
#  Cada linha tem o porquê. A ideia é ler, não copiar.
# ─────────────────────────────────────────────────────────────────────

# O prefixo padrão (Ctrl-b) briga com edição de linha. Ctrl-a é o costume
# de quem vem do screen. Troque se o seu dedo discordar.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── Percepção ────────────────────────────────────────────────────────

# Sem isto, você não vê que um agente terminou até olhar para o painel.
# Com isto, o nome da janela pisca. É o dispositivo de periferia mais
# barato que existe: custa zero e já resolve metade do problema.
setw -g monitor-activity on
set  -g visual-activity off        # o aviso visual no rodapé atrapalha mais que ajuda

# Índice começando em 1, porque a tecla 0 fica no fim do teclado e você
# vai trocar de painel centenas de vezes por dia.
set  -g base-index 1
setw -g pane-base-index 1

# ── Cor como endereço ────────────────────────────────────────────────
#
#  A ergonomia cognitiva diz que cor ajuda a reencontrar informação já
#  identificada, e que ela só funciona se for LOGICAMENTE relacionada à
#  tarefa. Cor por papel é endereço; cor bonita é ruído colorido.
#
#  A convenção deste posto:
#    vermelho  toca em produção ou faz coisa irreversível
#    amarelo   está esperando uma decisão sua
#    azul      exploração, pode quebrar à vontade
#    cinza     parado
#
#  A borda do painel ativo é branca, para você saber onde o seu teclado
#  está indo antes de digitar.

set -g pane-border-style        fg=colour240
set -g pane-active-border-style fg=colour255,bold

# Título de painel sempre visível: sem ele, seis painéis iguais viram
# um teste de memória.
set -g pane-border-status top
set -g pane-border-format " #{pane-index} #{?pane_title,#{pane_title},} "

# ── Rodapé ───────────────────────────────────────────────────────────
#
#  Mínimo. Um rodapé cheio compete com os agentes pela sua atenção, que
#  é exatamente o recurso que estamos tentando economizar.

set -g status-style bg=colour235,fg=colour250
set -g status-left  " posto #S "
set -g status-right " %H:%M "
set -g status-justify centre
setw -g window-status-current-style bg=colour160,fg=colour255,bold
setw -g window-status-activity-style bg=colour178,fg=colour232,bold

# ── Sobreviver ao fechamento do notebook ─────────────────────────────

# O servidor do tmux segue rodando quando você desconecta. É o que
# permite deixar agentes trabalhando e voltar depois. Este é o motivo
# principal de usar tmux com agentes, e não abas de terminal.
set -g destroy-unattached off

# Histórico grande, porque agente cospe muita linha e você vai querer
# voltar para descobrir onde ele divergiu em silêncio.
set -g history-limit 50000

# Mouse ligado: em posto de supervisão você olha mais do que digita, e
# rolar com o dedo custa menos que lembrar o atalho.
set -g mouse on
